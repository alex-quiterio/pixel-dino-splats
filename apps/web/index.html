<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixel Splat Zoo</title>
    <link rel="icon" type="image/png" href="./logo.png" />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/layout.css" />
    <link rel="stylesheet" href="./styles/controls.css" />
    <link rel="stylesheet" href="./styles/themes.css" />
  </head>
  <body>
    <div class="app">
    <aside class="sidebar">
      <img class="logo" src="./logo.png" width="96" height="96" alt="Pixel Splat Zoo logo: an impossible triangle" />
      <button id="menu-toggle" class="menu-toggle" aria-expanded="false" aria-controls="picker">☰ all creatures</button>
      <div id="siblings" class="siblings" role="group" aria-label="More in this group"></div>
      <div id="picker" class="picker" role="group" aria-label="Creature" hidden></div>
    </aside>
    <main class="stage">
      <h1 id="title">pixel splats</h1>
      <p class="sub"><span id="count">0</span> gaussians · <span id="pixels"></span> · <span id="ms"></span> · drag to rotate &amp; tilt · scroll or slide to zoom</p>
      <div class="frame" id="frame"><canvas id="view" aria-label="Pixel-art creature made of gaussian splats"></canvas></div>
      <div class="controls">
        <button id="spin" aria-pressed="true">spin</button>
        <button id="reroll">new colorway</button>
        <button id="reset">reset view</button>
        <label>zoom <input id="zoom" type="range" min="0.6" max="2.2" step="0.05" value="1" /></label>
        <label>pixels
          <select id="res">
            <option value="48">48</option>
            <option value="64">64</option>
            <option value="96">96</option>
            <option value="128" selected>128</option>
            <option value="192">192</option>
            <option value="256">256</option>
            <option value="384">384</option>
            <option value="512">512</option>
          </select>
        </label>
      </div>
      <p class="quote" id="quote"></p>
      <p class="name" id="name"></p>
    </main>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
